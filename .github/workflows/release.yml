# Builds the macOS and Windows installers and publishes them as a GitHub release.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# A tag with a suffix (v1.2.0-beta.1) becomes a pre-release. Running the workflow
# by hand (Actions > Release > Run workflow) builds everything and keeps the files
# as workflow artifacts, without creating a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The core tests gate every build: a tag with failing tests never ships.
  test:
    runs-on: blacksmith-6vcpu-macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and run the core tests
        run: |
          cmake -B build-core -DCMAKE_BUILD_TYPE=Release -DPSYBOX_BUILD_PLUGIN=OFF
          cmake --build build-core --parallel --target psybox_tests
          ./build-core/psybox_tests

  version:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.v.outputs.version }}
      numeric: ${{ steps.v.outputs.numeric }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then v=${GITHUB_REF_NAME#v}; else v=0.0.0-dev.${GITHUB_SHA::7}; fi
          numeric=${v%%-*}
          if [[ ! "$numeric" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"

  macos:
    needs: [version, test]
    runs-on: blacksmith-6vcpu-macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      OUT: build/PsyBox_artefacts/Release
      BUNDLES: VST3/PsyBox.vst3 AU/PsyBox.component Standalone/PsyBox.app
      # Signing and notarization run when the certificate secret is set (README > Releases).
      SIGN: ${{ secrets.MACOS_CERTIFICATES_P12 != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DPSYBOX_VERSION=${{ needs.version.outputs.numeric }}
          -DPSYBOX_BUILD_TESTS=OFF -DPSYBOX_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --parallel --target PsyBox_VST3 PsyBox_AU PsyBox_Standalone

      # Both architectures, and loadable on macOS 11 (a release once said minos 26.0).
      - name: Check the binaries
        run: |
          for b in $BUNDLES; do
            bin="$OUT/$b/Contents/MacOS/PsyBox"
            archs=$(lipo -archs "$bin")
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]] || { echo "::error::$b is $archs, not universal"; exit 1; }
            minos=$(otool -l "$bin" | awk '/minos/ { print $2 }' | sort -u)
            [[ "$minos" == "11.0" ]] || { echo "::error::$b needs macOS $minos, not 11.0"; exit 1; }
          done

      - name: Import Developer ID certificates
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass=$(uuidgen)
          base64 --decode <<<"$P12" > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" > /dev/null
          security list-keychains -d user | xargs security list-keychains -d user -s "$kc"
          rm "$RUNNER_TEMP/certs.p12"

          app=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          installer=$(security find-identity -v "$kc" | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          if [[ -z "$app" || -z "$installer" ]]; then
            echo "::error::The .p12 needs both the Developer ID Application and the Developer ID Installer identity"; exit 1
          fi
          team=${app##*(}
          { echo "APP_IDENTITY=$app"; echo "INSTALLER_IDENTITY=$installer"; echo "TEAM_ID=${team%)}"; } >> "$GITHUB_ENV"

      - name: Sign plug-ins
        if: env.SIGN == 'true'
        run: |
          for b in $BUNDLES; do
            codesign --force --timestamp --options runtime --sign "$APP_IDENTITY" "$OUT/$b"
            codesign --verify --strict --verbose=2 "$OUT/$b"
          done

      - name: Package
        run: |
          [[ "$SIGN" == true ]] || echo "::warning::MACOS_CERTIFICATES_P12 is not set, so the macOS build is not signed"
          packaging/macos/build-pkg.sh "$OUT" "$VERSION" "dist/PsyBox-$VERSION-macOS.pkg"

      - name: Notarize
        if: env.SIGN == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          pkg="dist/PsyBox-$VERSION-macOS.pkg"
          auth=(--apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$TEAM_ID")
          result=$(xcrun notarytool submit "$pkg" "${auth[@]}" --wait --timeout 1h --output-format json)
          echo "$result"
          if [[ $(jq -r .status <<<"$result") != Accepted ]]; then
            xcrun notarytool log "$(jq -r .id <<<"$result")" "${auth[@]}"; exit 1
          fi
          xcrun stapler staple "$pkg"
          # The pkg's ticket covers the bundles inside it, so the zipped copies can carry it too.
          for b in $BUNDLES; do
            xcrun stapler staple "$OUT/$b" || echo "::warning::Could not staple $b"
          done

      - name: Zip plug-ins
        run: |
          mkdir plugins
          ditto "$OUT/VST3/PsyBox.vst3" plugins/PsyBox.vst3
          ditto "$OUT/AU/PsyBox.component" plugins/PsyBox.component
          ditto -c -k plugins "dist/PsyBox-$VERSION-macOS-VST3-AU.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  windows:
    needs: [version, test]
    runs-on: blacksmith-4vcpu-windows-2025
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Quoted: PowerShell splits an unquoted -DPSYBOX_VERSION=1.2.0 at the first dot.
      - name: Configure
        run: >
          cmake -B build -A x64
          "-DPSYBOX_VERSION=${{ needs.version.outputs.numeric }}"
          -DPSYBOX_BUILD_TESTS=OFF -DPSYBOX_COPY_PLUGIN=OFF

      - name: Build
        run: cmake --build build --config Release --parallel --target PsyBox_VST3 PsyBox_Standalone

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Package
        run: |
          $out = "$PWD\build\PsyBox_artefacts\Release"
          # whichever Inno Setup choco installed (the folder carries the major version)
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          & $iscc "/DAppVersion=$env:VERSION" "/DArtefacts=$out" "/O$PWD\dist" packaging\windows\PsyBox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$out\VST3\PsyBox.vst3" -DestinationPath "dist\PsyBox-$env:VERSION-Windows-VST3.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, macos, windows]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          [[ "$VERSION" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "PsyBox $VERSION" --generate-notes "${flags[@]}"
